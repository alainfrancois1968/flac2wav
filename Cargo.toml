[package]
name = "flac2wav"
version = "0.1.0"
edition = "2021"
description = "Convert FLAC to WAV with parallel frame decoding"
readme = "README.md"

[[bin]]
name = "flac2wav"
path = "src/main.rs"

[dependencies]
claxon = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
